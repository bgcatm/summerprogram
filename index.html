<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-8月活動看板 - 全螢幕優化版</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --open-bg: #dcfce7; --open-text: #166534;
            --warn-bg: #fef3c7; --warn-text: #92400e;
            --full-bg: #fee2e2; --full-text: #991b1b;
            --cat-興趣班: #ef4444; --cat-幼兒: #3b82f6; --cat-兒童: #facc15;
            --cat-青年: #22c55e; --cat-21C: #f97316; --cat-義工: #ec4899; --cat-親子: #a855f7;
        }

        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            background-color: #f1f5f9; padding: 2px; margin: 0; 
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; /* 確保全螢幕不出現橫向捲軸 */
        }
        
        .page-header { position: relative; width: 100%; max-width: 1880px; text-align: center; margin: 5px 0; }
        .title-text { font-size: 26px; font-weight: 800; color: #1e293b; letter-spacing: 1px; }
        .update-date { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #64748b; background: white; padding: 2px 8px; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; }

        .toggle-bar { width: 100%; max-width: 1880px; display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 5px; padding-right: 10px; }
        .btn-tool { font-family: 'M PLUS Rounded 1c', sans-serif; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; color: white; transition: 0.2s; }
        .btn-tool:hover { filter: brightness(1.1); }
        .btn-toggle { background: #64748b; }
        .btn-import { background: #10b981; }
        .btn-file-io { background: #6366f1; }

        .admin-panel { background: #1e293b; color: white; padding: 10px; border-radius: 8px; width: 100%; max-width: 1880px; box-sizing: border-box; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .admin-panel.hidden { display: none; }
        .input-group { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .input-group input, .input-group select { font-family: 'M PLUS Rounded 1c', sans-serif; padding: 5px; border-radius: 4px; border: none; font-size: 13px; }

        /* 四欄活動區：針對 1920x1080 進行精確配比 */
        .grid-wrapper { width: 100%; display: flex; justify-content: center; padding-bottom: 10px; }
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(4, 460px); /* 460x4 = 1840px，適合 1920 寬度 */
            column-gap: 8px;
            row-gap: 3px;
            margin: 0 auto;
        }

        .activity-row { 
            background: white; padding: 0 6px; border-radius: 3px; display: flex; align-items: center; gap: 4px;
            height: 28px; /* 關鍵：壓縮高度以適應 30 行 */
            box-shadow: 0 1px 1px rgba(0,0,0,0.05); border-left: 5px solid #ccc;
            transition: background-color 0.1s;
        }
        .activity-row:hover { background-color: #f1f5f9; }
        
        .act-id { font-family: monospace; color: #94a3b8; font-size: 10px; width: 40px; flex-shrink: 0; }
        
        .act-name { 
            font-size: 12px; 
            font-weight: 700; 
            flex: 1; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #334155;
            min-width: 150px; 
        }

        .act-target { font-size: 10px; color: #64748b; width: 75px; text-align: center; flex-shrink: 0; white-space: nowrap; font-weight: 500; }

        .status-select { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 10px; padding: 1px 2px; border-radius: 3px; width: 85px; border: 1px solid transparent; cursor: pointer; font-weight: 700; height: 22px; }
        .status-open { background-color: var(--open-bg); color: var(--open-text); }
        .status-warn { background-color: var(--warn-bg); color: var(--warn-text); }
        .status-full { background-color: var(--full-bg); color: var(--full-text); }

        .delete-btn { color: #cbd5e1; cursor: pointer; font-size: 16px; opacity: 0; width: 15px; text-align: center; }
        .activity-row:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: #ef4444; }

        #file-input { display: none; }

        @media (max-width: 1850px) { .grid-container { grid-template-columns: repeat(3, 460px); } }
        @media (max-width: 1400px) { .grid-container { grid-template-columns: repeat(2, 460px); } }
    </style>
</head>
<body>

<div class="page-header">
    <div class="title-text">7️⃣& 8️⃣月屯門中心活動狀況看板☀️⛱️</div>
    <div class="update-date" id="date-display" onclick="updateDate()">最後更新日期: 2024-05-22</div>
</div>

<div class="toggle-bar">
    <button class="btn-tool btn-import" onclick="importFromExcel()">📥 批量匯入</button>
    <button class="btn-tool btn-file-io" onclick="exportData()">📤 匯出備份</button>
    <button class="btn-tool btn-file-io" onclick="document.getElementById('file-input').click()">📥 匯入備份</button>
    <input type="file" id="file-input" accept=".json" onchange="importData(event)">
    <button class="btn-tool btn-toggle" onclick="toggleAdmin()">⚙️ 管理</button>
</div>

<div class="admin-panel" id="admin-panel">
    <div class="input-group">
        <input type="text" id="act-id" style="width:60px" placeholder="編號">
        <input type="text" id="act-name" style="width:250px" placeholder="活動名稱">
        <input type="text" id="act-target" style="width:100px" placeholder="對象">
        <select id="act-cat">
            <option value="興趣班">興趣班 (紅)</option>
            <option value="幼兒">幼兒 (藍)</option>
            <option value="兒童">兒童 (黃)</option>
            <option value="青年">青年 (綠)</option>
            <option value="21C">21C (橙)</option>
            <option value="義工">義工 (粉)</option>
            <option value="親子">親子 (紫)</option>
        </select>
        <button onclick="addActivity()" style="background:#3b82f6;color:white;border:none;padding:8px 15px;border-radius:4px;cursor:pointer;font-weight:800">＋ 新增</button>
    </div>
</div>

<div class="grid-wrapper">
    <div class="grid-container" id="grid-content"></div>
</div>

<script>
    const idInput = document.getElementById('act-id'), nameInput = document.getElementById('act-name'),
          targetInput = document.getElementById('act-target'), catInput = document.getElementById('act-cat'),
          gridContent = document.getElementById('grid-content');

    const colorMap = { '興趣班': '#ef4444', '幼兒': '#3b82f6', '兒童': '#facc15', '青年': '#22c55e', '21C': '#f97316', '義工': '#ec4899', '親子': '#a855f7' };

    let activities = JSON.parse(localStorage.getItem('activity_v_1080p')) || [];
    let savedDate = localStorage.getItem('update_date_1080p') || "2024-05-22";
    document.getElementById('date-display').innerText = "最後更新日期: " + savedDate;

    function render() {
        gridContent.innerHTML = '';
        activities.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'activity-row';
            div.style.borderLeftColor = colorMap[item.category] || '#ccc';
            let colorClass = item.status === 'warn' ? 'status-warn' : (item.status === 'full' ? 'status-full' : 'status-open');
            div.innerHTML = `
                <div class="act-id">${item.id}</div>
                <div class="act-name" title="${item.name}">${item.name}</div>
                <div class="act-target">${item.target}</div>
                <select class="status-select ${colorClass}" onchange="updateStatus(${index}, this.value)">
                    <option value="open" ${item.status === 'open' ? 'selected' : ''}>✅ 接受報名</option>
                    <option value="warn" ${item.status === 'warn' ? 'selected' : ''}>⚠️ 即將滿額</option>
                    <option value="full" ${item.status === 'full' ? 'selected' : ''}>🚫 已滿額</option>
                </select>
                <div class="delete-btn" onclick="deleteItem(${index})">×</div>
            `;
            gridContent.appendChild(div);
        });
        localStorage.setItem('activity_v_1080p', JSON.stringify(activities));
    }

    function importFromExcel() {
        const raw = prompt("請貼上從 Excel 複製的資料：\n(編號、名稱、對象、類別)");
        if (!raw) return;
        const lines = raw.split('\n');
        let count = 0;
        lines.forEach(line => {
            const cols = line.split('\t');
            if (cols.length >= 2) {
                let id = cols[0].trim(), name = cols[1].trim(), target = cols[2]?.trim() || '-', cat = cols[3]?.trim() || '興趣班';
                if (!id || id === "編號" || name === "名稱") return;
                activities.push({ id, name, target, category: cat, status: 'open' });
                count++;
            }
        });
        if(count > 0) { render(); alert(`成功匯入 ${count} 筆活動！`); }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(activities, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `活動看板備份.json`;
        link.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = JSON.parse(evt.target.result);
                if (Array.isArray(data)) { activities = data; render(); }
            } catch { alert("失敗"); }
        };
        reader.readAsText(file);
    }

    function addActivity() {
        const id = idInput.value.trim(), name = nameInput.value.trim(), target = targetInput.value.trim();
        if (!id || !name) return;
        activities.push({ id, name, target: target || '-', category: catInput.value, status: 'open' });
        render(); idInput.value = ''; nameInput.value = ''; targetInput.value = '';
    }

    function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }
    function updateDate() {
        const d = prompt("日期:", savedDate);
        if(d) { savedDate = d; document.getElementById('date-display').innerText = "最後更新日期: " + d; localStorage.setItem('update_date_1080p', d); }
    }
    window.updateStatus = (idx, s) => { activities[idx].status = s; render(); };
    window.deleteItem = (idx) => { if(confirm("確定刪除？")) { activities.splice(idx, 1); render(); } };
    render();
</script>
</body>
</html>
